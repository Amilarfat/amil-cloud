 if(n==1){sheet(`<span class="tg">DEMO CHECKOUT</span>${bar(1)}${P.items.map(c=>`<div class="sum"><span>${PL[c.pl][0]} GB · ${PV[c.pv][0]}<br><small class="mut">${PL[c.pl][1]} vCPU · ${PL[c.pl][2]} · ${DUR[c.d][0]} · ${RG[c.r]} · ${OS[c.o]} ×${c.q}</small></span><span>${money(price(c.pl,c.pv,c.d)*c.q)}</span></div>`).join('')}<div class="sum"><b>Total</b><b>${money(tot())}</b></div><button class="btn w" id="cn" style="margin-top:12px">CONTINUE</button>`);$('#cn').onclick=()=>step(2)}
 if(n==2){sheet(`<span class="tg">DEMO CHECKOUT</span>${bar(2)}<div class="sum" style="border:2px solid var(--c)"><span>🟡 Binance / Crypto</span><span>Selected ✓</span></div><div class="mut" style="font-size:13px;margin:8px 0">You pay from your own Binance account. Payment is verified by the merchant before your order is processed.</div><button class="btn w" id="cn" style="margin-top:12px">CONTINUE</button>`);$('#cn').onclick=()=>step(3)}
 if(n==3){P.id=P.id||'AMCLD-'+Math.floor(100000+Math.random()*899999);sheet(`<span class="tg">DEMO CHECKOUT — NO REAL PAYMENT PROCESSOR CONNECTED</span>${bar(3)}<h2>Secure Payment</h2><div class="sum"><span>Order ID</span><span>${P.id}</span></div><div class="sum"><span>Amount</span><b>${money(tot())} ${CF.currency}</b></div><div class="sum"><span>Method</span><span>🟡 Binance / Crypto</span></div><div class="qr" style="${CF.qrCodeImage?`background-image:url(${CF.qrCodeImage})`:''}">${CF.qrCodeImage?'':'QR CODE PLACEHOLDER<br>(set qrCodeImage)'}</div><div class="addr">${CF.binancePaymentAddress}</div><div class="grid" style="margin-top:10px"><button class="btn g" id="pc">Copy Payment Address</button><a class="btn g" href="https://www.binance.com" target="_blank" rel="noopener">Open Binance</a><button class="btn ok" id="ph">I HAVE PAID</button></div><div id="px"></div><div class="warn">Never send payment to an address received outside the official AMIL CLOUD checkout.</div>`);
  $('#pc').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(CF.binancePaymentAddress);toast('Address copied')};
  $('#ph').onclick=()=>{$('#px').innerHTML=`<label>Transaction ID / TXID</label><input id="tx"><label>Payment proof screenshot (optional, stays in your browser)</label><input type="file" id="pf" accept="image/*"><div class="er" id="er"></div><button class="btn w" id="sp" style="margin-top:10px">Submit Payment Proof</button>`;$('#ph').style.display='none';$('#sp').onclick=()=>{if($('#tx').value.trim().length<6)return $('#er').textContent='Enter your transaction ID (TXID)';submit($('#tx').value.trim())}}}
 if(n==4){sheet(`${bar(4)}<div class="ok2"><b class="big">✓</b><h2>Payment Submitted ✓</h2><div class="sum"><span>Order</span><span>${P.lastId}</span></div><div class="sum"><span>Status</span><span class="st w">🟡 Pending Verification</span></div><p class="mut" style="margin:10px 0">Your payment proof has been submitted. Your order will be processed after verification.</p><div class="grid"><button class="btn" data-a="go" data-v="orders">VIEW ORDERS</button><button class="btn g" id="vp">▶ Watch what happens next</button></div></div>`);$('#vp').onclick=()=>{close();video(5)}}}
async function submit(tx){const P=pending;sheet(`<div class="ok2"><div class="sp2"></div><h3>Submitting payment proof…</h3></div>`);await sleep(1400);
 P.items.forEach((c,i)=>{S.orders.unshift({id:P.id+(P.items.length>1?'-'+(i+1):''),date:new Date().toLocaleDateString(),prod:PL[c.pl][0]+' GB Cloud Server',prov:PV[c.pv][0],amt:price(c.pl,c.pv,c.d)*c.q*(P.fromCart?1-S.disc:1),s:1,demo:1,reg:RG[c.r],os:OS[c.o],exp:new Date(Date.now()+[30,90,365][c.d]*864e5).toLocaleDateString(),tx})});
 P.lastId=P.id;if(P.fromCart){S.cart=[];S.disc=0}sv();badges();step(4)}
function track(i){const o=S.orders[i],L=['Order Received','Payment Verified','Service Provisioning','Service Ready','Credentials Delivered'],k=[1,2,3,4,5][o.s]||1;
 sheet(`<h2>${o.id}</h2><div class="sum"><span>Payment</span><span class="st ${o.s<2?'w':'ok'}">${o.s<2?'🟡 Pending Verification':'Verified'}</span></div><div class="tl">${L.map((l,j)=>`<div class="${j<[1,1,2,3,5][o.s]-(o.s==0?1:0)?'dn':j==[1,1,2,3,5][o.s]-(o.s==0?1:0)?'cu':''}">${l}</div>`).join('')}</div><div class="warn" style="background:#fbbf2418;border-color:#fbbf24;color:var(--w)">${o.demo?'DEMO: states are changed manually in the Admin demo. No blockchain verification or real provisioning happens in this HTML.':''}</div>`)}

{n:'How to Choose a Cloud Server',sc:[['services',30,40,'Open Services'],['plans',50,30,'Compare RAM and CPU'],['plans',50,62,'Select the server that fits'],['plans',72,82,'Tap View Details']]},
{n:'How to Create an Order',sc:[['plans',62,72,'Select 8 GB Cloud Server'],['cart',50,82,'Add to Cart'],['cart',62,88,'Proceed to Checkout'],['checkout',50,55,'Enter your information'],['checkout',50,86,'Review the order']]},
{n:'How to Pay',sc:[['checkout',50,60,'Open Checkout',0],['checkout',50,82,'Review Order',5],['pay',45,28,'Select Binance',10],['pay',50,48,'Open Payment QR',15],['pay',50,72,'Complete payment in your own Binance account',20],['proof',50,45,'Enter transaction information',30],['proof',50,62,'Upload payment proof if required',35],['proof',50,82,'Submit order',40],['status',50,48,'Order processing begins after verification',45]]},
{n:'How to Submit Payment Proof',sc:[['pay',50,85,'Tap I HAVE PAID'],['proof',50,42,'Paste your TXID'],['proof',50,62,'Add screenshot (optional)'],['proof',50,84,'Submit Payment Proof']]},
{n:'How Order Processing Works',sc:[['status',50,35,'Status: Pending Verification'],['status',50,52,'Merchant verifies payment'],['status',50,68,'Provisioning begins'],['dash',50,50,'Service appears in dashboard']]},
{n:'How to Access Your Purchased Service',sc:[['dash',30,40,'Open My Services'],['dash',50,60,'View service details'],['dash',70,78,'Use the connection details provided']]},
{n:'How to Contact Support',sc:[['support',50,30,'Tap the 💬 button'],['support',50,52,'Choose WhatsApp, Telegram or Email'],['support',50,78,'Or open a ticket']]},
{n:'Complete Purchase (silent)',sc:[['home',50,60,'Create an account'],['services',50,35,'Choose provider'],['plans',50,55,'Choose RAM / CPU / storage'],['plans',72,80,'Select duration'],['cart',50,80,'Add to cart → Checkout'],['pay',45,28,'Select Binance payment'],['pay',50,72,'Complete payment'],['proof',50,60,'Submit TXID / proof'],['status',50,45,'Wait for verification'],['dash',50,55,'Service appears in dashboard']]}];
TUT.forEach(t=>t.sc.forEach((s,i)=>{if(s[4]===undefined)s[4]=i*5;}));
const tf=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),dur=t=>tf(t.sc[t.sc.length-1][4]+5);
const MK={home:'<div class="bar"><b>AMIL CLOUD</b></div><div class="bx"><b>Premium Cloud Servers at Simple Prices</b><br><br><span class="bb">Explore</span><span class="bb" style="background:#243059">How It Works</span></div><div class="bx">AWS · Azure · OVHcloud · DigitalOcean …</div>',
services:'<div class="bar"><b>☁️ Services</b></div><div class="bx">🔍 Search…</div><div class="bx"><b>AWS</b> — from $10.35/mo</div><div class="bx"><b>Azure</b> — from $10.80/mo</div>',
plans:'<div class="bar"><b>Plans</b></div><div class="bx">4 GB · 2 vCPU · 80 GB</div><div class="bx">8 GB · 4 vCPU · 160 GB <span class="bb">BUY</span></div><div class="bx">16 GB · 6 vCPU · 320 GB</div>',
cart:'<div class="bar"><b>🛒 Cart</b></div><div class="bx">8 GB Cloud Server · $34.00</div><div class="bx">Total $34.00</div><span class="bb">CONTINUE SHOPPING</span><span class="bb">CHECKOUT</span>',
checkout:'<div class="bar"><b>Checkout 01 → 05</b></div><div class="bx">Full name</div><div class="bx">Email</div><div class="bx">Order total $34.00</div><span class="bb">CONTINUE</span>',
pay:'<div class="bar"><b>Secure Payment</b></div><div class="bx">🟡 Binance / Crypto</div><div class="qq">QR</div><div class="bx" style="text-align:center">YOUR_BINANCE_PAYMENT_ADDRESS</div><span class="bb">I HAVE PAID</span>',
proof:'<div class="bar"><b>Payment proof</b></div><div class="bx">TXID: ••••••••••••</div><div class="bx">📎 Screenshot</div><span class="bb">Submit Payment Proof</span>',
status:'<div class="bar"><b>Order AMCLD-123456</b></div><div class="bx">🟡 Pending Verification</div><div class="bx">✓ Order Received<br>⏳ Payment Verification</div>',

let vi=0,vt=0,vp=false,vk=-1,vidx=0,vtimer;
function video(i){vidx=i;vt=0;vp=true;vk=-1;$('#vd').classList.add('s');close();vframe();clearInterval(vtimer);vtimer=setInterval(vtick,100)}
function vframe(){const t=TUT[vidx];$('#vw').innerHTML=`<div class="vin" id="vin"></div><div class="sl" id="vsl"></div><div class="cp" id="vcp"></div><div class="hl" id="vhl"></div><div class="cr" id="vcr" style="left:50%;top:50%"><svg viewBox="0 0 24 24"><path d="M3 2l17 9-7 2-3 7z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg></div>`}
function vtick(){if(!vp)return;const t=TUT[vidx],end=t.sc[t.sc.length-1][4]+5;vt+=.1;if(vt>=end){vt=end;vp=false;$('#v1').textContent='▶ Play';S.seen[vidx]=100;sv()}
 let k=0;t.sc.forEach((s,j)=>{if(vt>=s[4])k=j});if(k!=vk){vk=k;const s=t.sc[k];$('#vin').innerHTML=`<div class="mk">${MK[s[0]]}</div>`;$('#vin').style.transformOrigin=s[1]+'% '+s[2]+'%';$('#vin').style.transform=k%2?'scale(1.45)':'scale(1)';$('#vsl').textContent='STEP '+String(k+1).padStart(2,'0')+' / '+String(t.sc.length).padStart(2,'0');$('#vcp').textContent=s[3];const c=$('#vcr'),h=$('#vhl');c.style.left=s[1]+'%';c.style.top=s[2]+'%';h.style.left=s[1]+'%';h.style.top=s[2]+'%';h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}
 $('#vpi').style.width=vt/end*100+'%';$('#vtm').textContent=tf(Math.floor(vt))+' / '+tf(end);if(vidx<8&&Math.floor(vt)%3==0){S.seen[vidx]=Math.max(S.seen[vidx]||0,Math.round(vt/end*100))}}
$('#v1').onclick=()=>{if(vt>=TUT[vidx].sc[TUT[vidx].sc.length-1][4]+5){vt=0;vk=-1}vp=!vp;$('#v1').textContent=vp?'⏸ Pause':'▶ Play'};$('#v2').onclick=()=>{vt=0;vk=-1;vp=true;$('#v1').textContent='⏸ Pause'};
$('#v3').onclick=()=>{const e=$('#vd');(e.requestFullscreen||e.webkitRequestFullscreen||(()=>toast('Fullscreen not supported'))).call(e)};$('#v4').onclick=()=>{vp=false;clearInterval(vtimer);sv();if(document.fullscreenElement)document.exitFullscreen();$('#vd').classList.remove('s')};
$('#vpb').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),end=TUT[vidx].sc[TUT[vidx].sc.length-1][4]+5;vt=(e.clientX-r.left)/r.width*end;vk=-1}
badges();go('home');
